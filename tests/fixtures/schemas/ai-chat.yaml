openapi: 3.1.0
info:
  title: AI Chat API
  version: 1.0.0
paths:
  /auth/signup:
    post:
      tags:
        - auth
      summary: Sign Up
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      tags:
        - auth
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      tags:
        - auth
      summary: Logout
      operationId: logout
      responses:
        '204':
          description: Successful Response
  /auth/refresh:
    post:
      tags:
        - auth
      summary: Refresh Token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /users/me:
    get:
      tags:
        - users
      summary: Get Current User
      operationId: getCurrentUser
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-staleTime: Infinity
      x-gcTime: Infinity
    patch:
      tags:
        - users
      summary: Update Current User
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    delete:
      tags:
        - users
      summary: Delete Current User
      operationId: deleteCurrentUser
      responses:
        '204':
          description: Successful Response
  /chats:
    get:
      tags:
        - chats
      summary: Get Chats
      operationId: getChats
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatListResponse'
    post:
      tags:
        - chats
      summary: Create Chat
      operationId: createChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
  /chats/{chatId}:
    get:
      tags:
        - chats
      summary: Get Chat
      operationId: getChat
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatDetailResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-staleTime: Infinity
    patch:
      tags:
        - chats
      summary: Update Chat Title
      operationId: updateChatTitle
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
    delete:
      tags:
        - chats
      summary: Delete Chat
      operationId: deleteChat
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Successful Response
  /chats/{chatId}/messages:
    get:
      tags:
        - chats
      summary: Get Messages
      operationId: getMessages
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
    post:
      tags:
        - chats
      summary: Send Message
      operationId: sendMessage
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreateRequest'
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
  /chats/{chatId}/stream-status:
    get:
      tags:
        - chats
      summary: Get Stream Status
      operationId: getStreamStatus
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamStatusResponse'
components:
  schemas:
    SignUpRequest:
      type: object
      required:
        - email
        - password
        - name
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    AuthResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - user
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        user:
          $ref: '#/components/schemas/UserResponse'
    UserResponse:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
        createdAt:
          type: string
          format: date-time
    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
        avatarUrl:
          type: string
    ChatResponse:
      type: object
      required:
        - id
        - title
        - createdAt
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
    ChatDetailResponse:
      type: object
      required:
        - id
        - title
        - createdAt
        - messageCount
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messageCount:
          type: integer
    ChatCreateRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        model:
          type: string
          default: gpt-4
    ChatUpdateRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
    ChatListResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatResponse'
        nextCursor:
          anyOf:
            - type: string
            - type: 'null'
    MessageListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MessageResponse'
    MessageResponse:
      type: object
      required:
        - id
        - chatId
        - createdAt
        - role
        - content
      properties:
        id:
          type: integer
        chatId:
          type: integer
        createdAt:
          type: string
          format: date-time
        role:
          $ref: '#/components/schemas/MessageRole'
        content:
          type: string
    MessageRole:
      type: string
      enum:
        - user
        - assistant
        - system
    MessageCreateRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
        role:
          $ref: '#/components/schemas/MessageRole'
    StreamStatus:
      type: string
      enum:
        - streaming
        - complete
        - error
    StreamStatusResponse:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/StreamStatus'
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        code:
          type: string
